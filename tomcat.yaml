
- name: Installation of Tomcat
  hosts: all
  become: yes

  tasks:
    - name: Fail if not run on Ubuntu
      ansible.builtin.fail:
        msg: "This playbook only works on Ubuntu"
      when: ansible_facts['distribution'] != "Ubuntu"

    - name: Install Java
      ansible.builtin.apt:
        name: "{{ java_package_name }}"
        update_cache: yes
        state: present
